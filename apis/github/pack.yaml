# GitHub pack (spec section 7.4.2). It implements four operations of
# forge/v1: list_files, get_file, post_comment and post_review.
#
# GitHub splits a pull request across two endpoints: the pull request itself
# carries no file list, and the files endpoint carries no title. get_change is
# therefore left without an implements, since forge/v1 asks for id, title and
# files in one call and GitHub cannot answer that in one request. A scenario
# that needs both pairs get_change with list_files, which does carry the
# diffs.
pack: github
version: 1
description: GitHub REST API

config:
  base_url: { default: https://api.github.com }

auth:
  kind: bearer

rate_limit:
  remaining_header: X-RateLimit-Remaining
  retry_after_header: Retry-After

pagination:
  style: link_header
  max_pages: 20

ops:
  get_change:
    get: /repos/{project}/pulls/{id}
    description: A pull request, without the files it touches
    readonly: true
    params:
      # owner/repo, a real slash in the path: GitHub routes on it, so the
      # argument is not percent-encoded the way a GitLab project path is.
      project: { pattern: '^[\w.-]+/[\w.-]+$' }
      id: { pattern: '^\d+$' }
    transform: |
      { id: .number, title, description: .body, author: .user.login,
        base: .base.sha, head: .head.sha, url: .html_url }

  list_files:
    get: /repos/{project}/pulls/{id}/files
    description: Files a pull request touches, with their diffs
    readonly: true
    paginate: true
    params:
      project: { pattern: '^[\w.-]+/[\w.-]+$' }
      id: { pattern: '^\d+$' }
    # GitHub calls a removed file "removed", not "deleted". A binary file
    # comes back without .patch, and the field is added only when there is
    # one: forge/v1 types diff as text, so a null would be worse than an
    # absent key.
    transform: |
      [ .[] | { path: .filename, deleted: (.status == "removed") }
            + (if .patch then { diff: .patch } else {} end) ]
    implements: forge/v1.list_files
    max_bytes: 500k

  get_file:
    get: /repos/{project}/contents/{path}
    description: Content of one file at a ref
    readonly: true
    params:
      project: { pattern: '^[\w.-]+/[\w.-]+$' }
      # The whole path is one segment, slashes included; GitHub keeps real
      # path segments in the URL, unlike GitLab, so no encode: path here.
      path: { pattern: '^[^\s?#]+$' }
      ref: { pattern: '^[\w./-]+$', required: false, in: query }
    # GitHub base64-encodes the content and wraps the lines at 60 characters;
    # the newlines have to go before the value can be decoded. The response
    # does not echo the ref, only the blob sha, which is reported as such.
    transform: '{ content: (.content | gsub("\n"; "") | @base64d), path, sha }'
    implements: forge/v1.get_file
    max_bytes: 500k

  post_comment:
    post: /repos/{project}/issues/{id}/comments
    description: Comment on a pull request
    encode: json
    # A pull request is an issue as far as GitHub's comment API is
    # concerned: there is one endpoint for both, under /issues/{id}.
    params:
      project: { pattern: '^[\w.-]+/[\w.-]+$' }
      id: { pattern: '^\d+$' }
      body: { max_len: 65000, in: body }
    transform: '{ id, url: .html_url }'
    implements: forge/v1.post_comment

  post_review:
    post: /repos/{project}/pulls/{id}/reviews
    description: Review a pull request with a summary and line comments in one batch
    encode: json
    params:
      project: { pattern: '^[\w.-]+/[\w.-]+$' }
      id: { pattern: '^\d+$' }
      summary: { name: body, max_len: 65000, required: false, in: body }
      # Each entry of comments is { path, line, body }, the shape GitHub's
      # pull request review API wants for a single-line comment.
      comments: { in: body }
      event: { pattern: '^[A-Z_]+$', enum: [COMMENT, APPROVE, REQUEST_CHANGES], default: COMMENT, in: body }
    transform: '{ id, url: .html_url }'
    implements: forge/v1.post_review
