# GitLab pack (spec section 7.4.2). The first pack of the project: it teaches
# baton the GitLab REST API without putting the name GitLab into the binary.
#
# The pack implements four of the five operations of forge/v1. GitLab posts
# one discussion per comment and has no batch review call, so post_review is
# left out on purpose (spec section 7.4.5): a scenario walks post_comment in
# a foreach instead, and a scenario that declares interface: forge/v1 is told
# so during validation rather than at run time.
pack: gitlab
version: 1
description: GitLab REST API v4

config:
  base_url: { default: https://gitlab.com/api/v4 }

# A personal, project or group access token, sent as PRIVATE-TOKEN. The pack
# names the header, the scenario names the secret.
auth:
  kind: header
  name: PRIVATE-TOKEN

rate_limit:
  remaining_header: RateLimit-Remaining
  retry_after_header: Retry-After

# GitLab reports errors with a status code and a message field; the message is
# what a scenario wants to see in the error. The type check comes first: a
# list endpoint answers with an array, which has no fields at all.
envelope:
  error_when: 'type == "object" and .message != null'
  error_message: .message

pagination:
  style: link_header
  max_pages: 20

ops:
  get_change:
    get: /projects/{project}/merge_requests/{id}/changes
    description: Changes of a merge request
    readonly: true
    params:
      project: { pattern: '^[\w./-]+$', encode: path }
      id: { pattern: '^\d+$' }
    transform: |
      { id: .iid, title, description, author: .author.username,
        base: .diff_refs.base_sha, head: .diff_refs.head_sha,
        files: [ .changes[] | { path: .new_path, diff, deleted: .deleted_file } ] }
    implements: forge/v1.get_change
    max_bytes: 500k

  list_files:
    get: /projects/{project}/merge_requests/{id}/diffs
    description: Files a merge request touches, with their diffs
    readonly: true
    paginate: true
    params:
      project: { pattern: '^[\w./-]+$', encode: path }
      id: { pattern: '^\d+$' }
    transform: '[ .[] | { path: .new_path, diff, deleted: .deleted_file } ]'
    implements: forge/v1.list_files
    max_bytes: 500k

  get_file:
    get: /projects/{project}/repository/files/{path}
    description: Content of one file at a ref
    readonly: true
    params:
      project: { pattern: '^[\w./-]+$', encode: path }
      # The whole path is one segment for GitLab, slashes included.
      path: { pattern: '^[^\s?#]+$', encode: path }
      # forge/v1 leaves the ref optional; GitLab always wants one, so the
      # default stands in for "whatever the default branch points at".
      ref: { pattern: '^[\w./-]+$', default: HEAD, in: query }
    # GitLab answers with the content base64-encoded, whatever the file is.
    transform: '{ content: (.content | @base64d), path: .file_path, ref }'
    implements: forge/v1.get_file
    max_bytes: 500k

  list_merge_requests:
    get: /projects/{project}/merge_requests
    description: Merge requests of a project, newest update first
    readonly: true
    paginate: true
    params:
      project: { pattern: '^[\w./-]+$', encode: path }
      state: { pattern: '^[a-z]+$', enum: [opened, closed, merged, locked, all], default: merged, in: query }
      # An ISO 8601 date or timestamp, as GitLab expects it.
      updated_after: { pattern: '^[\d:.TZ+-]+$', required: false, in: query }
    transform: |
      [ .[] | { id: .iid, title, author: .author.username, url: .web_url,
                merged_at, updated_at } ]
    max_bytes: 500k

  post_comment:
    post: /projects/{project}/merge_requests/{id}/notes
    description: Comment on a merge request
    encode: json
    params:
      project: { pattern: '^[\w./-]+$', encode: path }
      id: { pattern: '^\d+$' }
      body: { max_len: 65000, in: body }
    transform: '{ id, url: .web_url }'
    implements: forge/v1.post_comment
